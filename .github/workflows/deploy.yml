name: Deploy (daily volunteer update)

# 1) main에 push할 때  2) 매일 00:00 UTC = 한국 오전 9시  3) 수동 실행(Run workflow)
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 매일 09:00 KST (UTC 00:00). GitHub 사정으로 몇 분 지연될 수 있음.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 1365 서울 봉사공고 최신 20건 가져오기 (실패해도 배포는 계속 → 직전 데이터 유지)
      - name: Update volunteer data (1365, Seoul)
        continue-on-error: true
        run: node scripts/fetch-volunteers.mjs

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
